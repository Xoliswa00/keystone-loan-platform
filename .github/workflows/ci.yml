name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Daily drift check — re-runs the full gate (Pint, PHP lint,
  # monitoring:verify, tests) against main even when nothing was pushed, so a
  # direct merge, revert, or dependency change that never triggered a
  # push/PR run still gets caught. A scheduled run always checks out the
  # default branch (main), which is exactly what we want to audit here, so
  # the checkout step needs no explicit ref.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Lint PHP syntax
        run: find app database routes config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -uroot --silent && break
            sleep 2
          done

      # Explicit, not incidental: some test classes use DatabaseTransactions
      # (assumes an already-migrated schema) rather than RefreshDatabase
      # (which migrates on first use). Whichever runs first alphabetically
      # determines whether the schema exists yet — on a fresh CI database,
      # that's non-deterministic unless migrations run as their own step.
      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force

      # Server-side mirror of .githooks/pre-commit and pre-push, which only
      # protect a clone that's run `composer install` at least once. This
      # makes it unconditional — can't be skipped with --no-verify or
      # bypassed by a push from a clone that never installed the hooks.
      - name: Verify Xquisite monitoring integration
        run: php artisan monitoring:verify

      # Injection guards as their own named step, so a failure says "security"
      # rather than hiding in the full suite. BladeJsContextTest scans every
      # view for a Blade echo inside a JavaScript string; the rest replay each
      # attack fixed in the 2026-10-09 audit.
      - name: Security tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test tests/Feature/Security

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test
